name: snp-automate-2023-polishing-real-robot
services:
  snp_automate_2023_sim:
    build:
      context: /home/liangfx/ros2_ws
      dockerfile: /home/liangfx/snp/docker/Dockerfile.custom
    container_name: snp_automate_2023_real
    environment:
      HOME: /workspace/snp_home
      DISPLAY: ${DISPLAY:-:0}
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"
      XDG_RUNTIME_DIR: /tmp/runtime-1006
      SNP_SIM_ROBOT: "false"
      SNP_SIM_VISION: "true"
      SNP_BYPASS_EXECUTION: "false"
      ROS_LOG_DIR: /workspace/snp_home/.ros
      ROS_DOMAIN_ID: "10"
      AMENT_PREFIX_PATH: /opt/snp_automate_2023/install:/opt/snp/install:/opt/tesseract_ros2/install:/opt/tesseract_planning/install:/opt/trajopt/install:/opt/tesseract/install:/opt/ros/jazzy
    user: "${CURRENT_UID:-1000:1000}"
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../runtime/snp_home:/workspace/snp_home
      - ../config:/workspace/config:ro
      - ../config:/opt/snp_automate_2023/install/snp_automate_2023/share/snp_automate_2023/config:ro
      - ../launch:/opt/snp_automate_2023/install/snp_automate_2023/share/snp_automate_2023/launch:ro
      - ../urdf:/opt/snp_automate_2023/install/snp_automate_2023/share/snp_automate_2023/urdf:ro
      - ../meshes:/opt/snp_automate_2023/install/snp_automate_2023/share/snp_automate_2023/meshes:ro
